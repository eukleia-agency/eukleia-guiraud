<!DOCTYPE html>
<html lang="fr" data-lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Tourelle · Eukleia</title>
<meta name="theme-color" content="#1B2B4B">
<meta property="og:title" content="La Tourelle · Eukleia">
<meta property="og:description" content="Votre guide personnel pour Deauville — 7 au 9 novembre 2026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400&family=DM+Sans:opsz,wght@9..40,400..700&family=Cormorant+Garamond:wght@400&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" rel="stylesheet">
<style>
:root{
  --navy:#1B2B4B; --gold:#B8975A; --gold-soft:#D6C3A0;
  --ivory:#F6F4EE; --paper:#FFFDF9; --ink:#232C3F; --muted:#6E7686; --rule:#E6E0D3;
  --serif:'Playfair Display',Georgia,serif; --sans:'DM Sans','Segoe UI',Helvetica,Arial,sans-serif; --brand:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ivory);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:.01em}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:600}

.hero{position:relative;min-height:76vh;display:flex;flex-direction:column;justify-content:flex-end;
  background:radial-gradient(120% 90% at 20% 10%,#2A4066 0%,#1B2B4B 45%,#0E1829 100%);color:#fff;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(11,20,35,.42) 0%,rgba(11,20,35,.18) 34%,rgba(11,20,35,.74) 72%,rgba(11,20,35,.95) 100%);pointer-events:none}
.hero-photo{position:absolute;inset:0;background-size:cover;background-position:center 62%;opacity:.92;
  background-image:var(--photo)}
.hero-inner{position:relative;z-index:2;padding:0 20px 54px;max-width:960px;margin:0 auto;width:100%}
.hero h1{font-size:clamp(46px,10vw,88px);line-height:1;margin:10px 0 14px}
.hero .sub{font-family:var(--serif);font-size:clamp(18px,4vw,24px);font-style:italic;color:var(--gold-soft)}
.hero .dates{margin-top:18px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.langbar{position:absolute;top:18px;right:20px;z-index:5;display:flex;gap:6px;background:rgba(255,255,255,.14);
  backdrop-filter:blur(8px);border-radius:999px;padding:4px}
.langbar button{border:0;background:transparent;color:rgba(255,255,255,.78);font-family:var(--sans);font-size:12px;
  font-weight:600;letter-spacing:.1em;padding:7px 14px;border-radius:999px;cursor:pointer}
.langbar button.on{background:var(--gold);color:#fff}
.brandmark{position:absolute;top:20px;left:20px;z-index:5;font-family:var(--serif);font-size:20px;letter-spacing:.32em;color:#fff;opacity:.92}

section{padding:62px 0}
.sec-head{margin-bottom:24px}
.sec-head h2{font-size:clamp(30px,6vw,42px);line-height:1.1;margin-top:6px}
.sec-head p{color:var(--muted);font-size:15px;margin-top:10px;max-width:62ch}

/* ===== CALENDAR ===== */
.cal{background:var(--paper);border:1px solid var(--rule);border-radius:20px;padding:18px 16px 8px}
.calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.calhead div{text-align:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{aspect-ratio:1/1;border:1px solid transparent;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:.15s;background:#fff;position:relative}
.cell:hover{border-color:var(--gold-soft)}
.cell .num{font-family:var(--serif);font-size:20px;line-height:1}
.cell .dots{display:flex;gap:3px;height:6px}
.cell .dots i{width:5px;height:5px;border-radius:50%;display:block}
.cell.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.cell.on .num{color:#fff}
.cell.today::after{content:"";position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.callegend{display:flex;flex-wrap:wrap;gap:12px;padding:14px 4px 8px;font-size:11.5px;color:var(--muted)}
.callegend span{display:flex;align-items:center;gap:5px}
.callegend i{width:7px;height:7px;border-radius:50%;display:block}

.daypanel{background:var(--paper);border:1px solid var(--rule);border-radius:18px;padding:24px;margin-top:14px}
.daypanel .dh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.daypanel h3{font-size:27px}
.daypanel .dow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.daypanel .dlead{color:var(--muted);font-size:14px;margin-bottom:16px}
.tide{background:linear-gradient(180deg,#F7F5EF 0%,#FFFDF9 100%);border:1px solid var(--rule);
  border-radius:16px;padding:16px 18px 12px;margin:0 0 18px}
.tide .th{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.tide .th b{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}
.tide .th span{font-size:11.5px;color:var(--muted)}
.tide svg{display:block;width:100%;height:132px;overflow:visible}
.tide .tl{display:flex;flex-wrap:wrap;gap:12px 26px;margin-top:14px}
.tide .tl i{font-style:normal;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;font-weight:700}
.tide .tl b{font-family:var(--serif);font-size:20px;font-weight:500}
.ev{display:flex;gap:13px;padding:14px 0;border-top:1px solid var(--rule)}
.ev:first-of-type{border-top:0}
.ev .bar{flex:0 0 4px;border-radius:4px;align-self:stretch}
.ev .txt b{font-family:var(--serif);font-size:19px;font-weight:500;display:block}
.ev .txt p{font-size:14px;color:var(--muted);margin-top:2px}
.ev .txt .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.navday{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
.navday button{flex:1;border:1px solid var(--rule);background:#fff;border-radius:999px;padding:10px;
  font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--navy);cursor:pointer}
.navday button:disabled{opacity:.35;cursor:default}

/* ===== MAP ===== */
#map{height:440px;border-radius:18px;overflow:hidden;border:1px solid var(--rule)}
.mapfail{height:auto;padding:34px 26px;background:var(--paper);text-align:center}
.mapfail h4{font-family:var(--serif);font-size:23px;font-weight:500;margin-bottom:8px}
.mapfail p{font-size:14px;color:var(--muted);max-width:46ch;margin:0 auto 18px}
.mapfail a{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;font-weight:700;
  font-size:13px;padding:12px 24px;border-radius:999px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.filters button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:8px 14px;
  font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);font-family:var(--sans)}
.filters button.on{color:#fff;border-color:transparent}
.mapviews{display:flex;gap:8px;margin:0 0 12px}
.mapviews button{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;
  padding:8px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.mapviews button.on{background:var(--navy);color:#fff}
.maplibregl-popup-content{font-family:var(--sans);border-radius:14px;padding:14px 16px}
.maplibregl-popup-content b{font-family:var(--serif);font-size:18px;font-weight:500}
.pin{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:15px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.28);border:2px solid #fff}

/* ===== ACCORDIONS ===== */
.acc{border:1px solid var(--rule);border-radius:18px;overflow:hidden;margin-bottom:12px;background:var(--paper)}
.acc-h{display:flex;align-items:center;gap:12px;padding:18px 20px;cursor:pointer;user-select:none}
.acc-h .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.acc-h b{font-family:var(--serif);font-size:23px;font-weight:500;flex:1}
.acc-h .cnt{font-size:12px;color:var(--muted)}
.acc-h .chev{transition:.25s;color:var(--muted)}
.acc.open .chev{transform:rotate(180deg)}
.acc-b{display:none;padding:0 20px 12px}
.acc.open .acc-b{display:block}
.card{border-top:1px solid var(--rule);padding:16px 0;display:flex;gap:14px}
.card .emo{font-size:22px;flex:0 0 30px;line-height:1.2}
.card h4{font-family:var(--serif);font-size:20px;font-weight:500}
.card .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.card p{font-size:14.5px;color:#4B5464;margin:4px 0 8px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.links a{font-size:12px;font-weight:600;text-decoration:none;border:1px solid var(--rule);
  border-radius:999px;padding:6px 12px;color:var(--navy);background:#fff}

/* ===== NIGHT ===== */
.night{background:var(--navy);color:#fff}
.night .sec-head h2{color:#fff}
.night .sec-head p{color:rgba(255,255,255,.7)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:14px}
.box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:20px}
.box h4{font-family:var(--serif);font-size:21px;font-weight:500;margin-bottom:8px;color:var(--gold-soft)}
.box p{font-size:14.5px;color:rgba(255,255,255,.86);margin-bottom:6px}
.copy{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.08);
  border-radius:10px;padding:9px 12px;margin-top:8px;font-size:14px}
.copy button{border:0;background:var(--gold);color:#fff;font-family:var(--sans);font-weight:600;font-size:11px;
  letter-spacing:.08em;padding:6px 12px;border-radius:8px;cursor:pointer}
.pill-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill-links a{font-size:12.5px;font-weight:600;text-decoration:none;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 14px;color:#fff}

.cta{text-align:center;padding:70px 0}
.cta h2{font-size:clamp(30px,6vw,44px)}
.cta p{color:var(--muted);max-width:54ch;margin:12px auto 24px}
.btn{display:inline-block;background:var(--gold);color:#fff;text-decoration:none;font-weight:700;font-size:14px;
  letter-spacing:.06em;padding:15px 30px;border-radius:999px}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--navy);margin-left:8px}
footer{border-top:1px solid var(--rule);padding:34px 0 46px;text-align:center;color:var(--muted);font-size:12.5px}
footer .lg{font-family:var(--serif);font-size:22px;letter-spacing:.34em;color:var(--navy);margin-bottom:8px}
@media(max-width:600px){
  .cal{padding:14px 10px 6px}
  .cell .num{font-size:17px}
  .btn.ghost{margin:10px 0 0 0}
  #map{height:340px}
}

  --glass:linear-gradient(135deg,rgba(255,255,255,.80),rgba(255,255,255,.56));
  --glass-b:rgba(255,255,255,.72);
  --glass-sh:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.25),0 12px 36px rgba(8,16,32,.30);
  --nglass:linear-gradient(135deg,rgba(27,43,75,.64),rgba(14,24,41,.50));
  --on-dark:#EEF1F6; --on-dark-2:#C3CBDA}
body{background:#0E1829;color:var(--on-dark)}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#0E1829}
.bg::before{content:"";position:absolute;inset:-60px;background:var(--photo) center/cover no-repeat;filter:blur(42px) saturate(1.35);transform:scale(1.1);opacity:.9}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 15% 10%,rgba(184,151,90,.32),transparent 60%),radial-gradient(80% 60% at 90% 80%,rgba(42,64,102,.55),transparent 65%),radial-gradient(70% 50% at 10% 95%,rgba(184,151,90,.22),transparent 60%),linear-gradient(180deg,rgba(14,24,41,.35),rgba(14,24,41,.66))}
.hero{min-height:72vh}
.hero::after{background:linear-gradient(180deg,rgba(11,20,35,.42) 0%,rgba(11,20,35,.16) 34%,rgba(11,20,35,.70) 72%,#0E1829 100%)}
.langbar{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%)}
.sec-head h2{color:#fff}
.sec-head p{color:var(--on-dark-2)}
.eyebrow{color:#E2CC9C}
.cal,.daypanel,.acc,#map,.mapfail{background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--glass-sh);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);color:var(--ink)}
.cal,.daypanel,.acc{border-radius:22px}
#map{border-radius:22px}
.cell{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.6)}
.cell:hover{border-color:var(--gold)}
.cell.on{background:var(--navy);border-color:var(--navy);box-shadow:0 6px 18px rgba(27,43,75,.35)}
.callegend{color:#55607A}
.calhead div{color:#55607A}
.tide{background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.35));border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.ev{border-top-color:rgba(27,43,75,.12)}
.navday button,.filters button,.mapviews button{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 4px 14px rgba(8,16,32,.18);
  -webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);color:var(--navy)}
.mapviews button.on,.filters button.on{box-shadow:0 6px 18px rgba(8,16,32,.28)}
.mapviews button.on{background:var(--navy)}
.card{border-top-color:rgba(27,43,75,.12)}
.card p{color:#3E4A62}
.links a{background:rgba(255,255,255,.7);border-color:rgba(255,255,255,.9)}
.night{background:transparent}
.box{background:var(--nglass);border:1px solid rgba(255,255,255,.24);border-radius:22px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 12px 40px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%)}
.copy{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14)}
.pill-links a{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3)}
.cta p{color:var(--on-dark-2)}
.cta h2{color:#fff}
.btn.ghost{color:#fff;border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.08)}
footer{border-top-color:rgba(255,255,255,.18);color:var(--on-dark-2)}
footer .lg{color:#fff}
.maplibregl-popup-content{background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.8)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .cal,.daypanel,.acc,#map,.mapfail{background:rgba(255,255,255,.94)} .box{background:rgba(27,43,75,.96)} .navday button,.filters button,.mapviews button{background:rgba(255,255,255,.95)}}
@media (prefers-reduced-transparency:reduce){
  .cal,.daypanel,.acc,#map,.mapfail{background:rgba(255,255,255,.96)} .box{background:rgba(27,43,75,.97)}}

/* ===== icônes 3D de la section appartement ===== */
.box h4{display:flex;align-items:center;gap:13px}
.box h4 .ico3d{width:58px;height:58px;flex:none;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,.38)) drop-shadow(0 1px 1px rgba(0,0,0,.25))}

/* ===== boutons des fiches en icônes 3D ===== */
.links{gap:10px}
.links a{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border-radius:14px;
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #fff,0 4px 12px rgba(8,16,32,.18)}
.links a img{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.28))}
.links a.web{width:auto;padding:0 14px;font-size:12px;font-weight:600;color:var(--navy);text-decoration:none}

/* ===== filtres de la carte : « Tout » + sélection unique, bandeau défilant ===== */
.mapviews{display:none}
.filters{display:flex;flex-wrap:nowrap;gap:8px;margin:0 -20px 14px;padding:4px 20px 10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;scroll-snap-align:start;padding:9px 14px 9px 12px;font-size:13px}
.filters button i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.filters button em{font-style:normal;font-size:11px;font-weight:700;line-height:1;padding:3px 7px;border-radius:999px;background:rgba(27,43,75,.09);color:var(--navy)}
.filters button.on{color:#fff;border-color:transparent}
.filters button.on i{box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.filters button.on em{background:rgba(255,255,255,.26);color:#fff}
.filters button.all.on{background:var(--navy)}
.filthint{font-size:12.5px;color:var(--on-dark-2);margin:-4px 0 12px}
.mapwrap{position:relative}
.mapbtn{position:absolute;top:12px;right:12px;z-index:5;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.82);color:var(--navy);
  font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.04em;padding:8px 13px;border-radius:999px;cursor:pointer;
  box-shadow:inset 0 1px 0 #fff,0 4px 14px rgba(8,16,32,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.mapbtn.hide{display:none}

/* ===== système typographique : serif = titres & noms d'adresses, sans = tout le reste ; EUKLEIA garde Cormorant ===== */
.brandmark,footer .lg{font-family:var(--brand)}
.hero h1{font-size:clamp(42px,9.5vw,80px);line-height:1.02}
.hero .sub{font-size:clamp(17px,3.8vw,22px)}
.hero .dates{font-size:12px;letter-spacing:.2em;font-weight:600}
.eyebrow{font-size:11px;letter-spacing:.26em;font-weight:700}
.sec-head h2{font-size:clamp(28px,5.6vw,38px);line-height:1.12}
.sec-head p{font-size:15px}
.calhead div{font-size:10.5px;font-weight:700}
.cell .num{font-family:var(--sans);font-weight:600;font-size:17px}
.daypanel h3{font-size:25px}
.daypanel .dow{font-size:11px;font-weight:700}
.tide .th b{font-size:11px}
.tide .tl b{font-family:var(--sans);font-weight:600;font-size:17px;letter-spacing:-.01em}
.ev .txt b{font-family:var(--sans);font-weight:600;font-size:15.5px;line-height:1.35}
.ev .txt p{font-size:14px}
.acc-h b{font-size:21px}
.card h4{font-size:19px;line-height:1.25}
.card p{font-size:14.5px}
.card .tag{font-size:10.5px;font-weight:700}
.box h4{font-size:20px}
.box p{font-size:14.5px}
.maplibregl-popup-content b{font-family:var(--sans);font-weight:700;font-size:15px}
.mapfail h4{font-size:22px}
.cta h2{font-size:clamp(28px,5.6vw,40px)}
.btn{font-size:13.5px;font-weight:700;letter-spacing:.05em}
.navday button,.filters button,.links a.web,.copy button,.pill-links a,.mapbtn{font-family:var(--sans)}
h1,h2,h3,h4{font-weight:500} .hero h1{font-weight:500;letter-spacing:-.01em} .hero .sub{font-weight:400}

/* ===== filtres : « Tout » toujours visible, rappel du filtre dans la liste ===== */
.filters button.all{position:sticky;left:0;z-index:2;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 4px 14px rgba(8,16,32,.18),8px 0 10px -6px rgba(14,24,41,.45)}
.filters button.all:not(.on){background:rgba(255,255,255,.92)}
.filtnote{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px;padding:12px 16px;border-radius:16px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:var(--on-dark);font-size:13.5px}
.filtnote b{font-weight:700}
.filtnote button{border:0;background:#fff;color:var(--navy);font-family:var(--sans);font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer}


/* ===== moteur v7 : coquille applicative ===== */
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:#fff;color:var(--navy);padding:10px 14px;border-radius:10px;font-weight:700}
.skip:focus{left:12px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;
  background:linear-gradient(180deg,rgba(14,24,41,.82),rgba(14,24,41,.66));border-bottom:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 10px 30px rgba(8,16,32,.28);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.topbar .brandmark{position:static;font-size:17px;letter-spacing:.3em;cursor:pointer;background:none;border:0;color:#fff;font-family:var(--brand)}
.topbar .langbar{position:static}
/* favoris : bouton cœur avec compteur, à gauche de FR/EN (principe du panier) */
.topright{display:flex;align-items:center;gap:10px;flex-shrink:0}
.favtop{position:relative;width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
  -webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
.favtop svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round;transition:fill .2s,stroke .2s,transform .2s}
.favtop.has svg{fill:var(--gold);stroke:var(--gold)}
.favtop.on{background:var(--gold);border-color:var(--gold)} .favtop.on svg{fill:#fff;stroke:#fff}
.favtop:active svg{transform:scale(.88)}
.favtop .favn{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--gold);color:#fff;border:2px solid rgba(14,24,41,.9);
  font-family:var(--sans);font-size:10.5px;font-weight:800;line-height:14px;text-align:center}
.favtop .favn[hidden]{display:none}
.favtop.on .favn{background:#fff;color:var(--navy)}
.favpage{min-height:120px} .favpage .favempty{font-size:15px;color:#3E4A62;margin:4px 0 6px}
.topnav{display:none;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
.topnav a{font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--on-dark-2);text-decoration:none;padding:8px 12px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.topnav a:hover{color:#fff;background:rgba(255,255,255,.08)}
.topnav a.on{color:var(--navy);background:rgba(255,255,255,.92)}
main{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.screen{display:none;padding:22px 0 40px}
.screen.on{display:block}
.screen .sec-head{margin-bottom:18px}
.hero{min-height:52vh;margin:-22px 0 22px}
.hero-inner{padding:0 20px 34px}
.hero h1{font-size:clamp(40px,9vw,76px);margin:8px 0 10px}
.hero .dates{margin-top:12px}
.hcard{background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--glass-sh);border-radius:22px;padding:20px;margin-bottom:14px;color:var(--ink);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}
.hcard h3{font-family:var(--serif);font-size:23px;font-weight:500;line-height:1.2;margin:2px 0 8px}
.hcard .eyebrow{color:var(--gold)}
.hcard p{font-size:14.5px;color:#3E4A62}
.hcard .more{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;color:var(--navy);text-decoration:none}
.hcard a.lnk{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--navy);text-decoration:none;border:1px solid rgba(27,43,75,.25);background:rgba(255,255,255,.7);border-radius:999px;padding:8px 14px}
.updated{font-size:12px;color:var(--on-dark-2);margin:-4px 0 16px;letter-spacing:.04em}
/* recherche */
.search{position:relative;margin-bottom:14px}
.search input{width:100%;border:1px solid var(--glass-b);background:rgba(255,255,255,.88);border-radius:999px;padding:14px 18px 14px 46px;font-family:var(--sans);font-size:15px;color:var(--ink);box-shadow:var(--glass-sh)}
.search input::placeholder{color:#7A8396}
.search svg{position:absolute;left:17px;top:15px;width:18px;height:18px;stroke:var(--navy);fill:none;stroke-width:2.2;pointer-events:none}
.sres{display:none;margin-top:8px;background:rgba(255,255,255,.96);border:1px solid var(--glass-b);border-radius:18px;box-shadow:var(--glass-sh);overflow:hidden}
.sres.on{display:block}
.sres button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:12px 16px;font-family:var(--sans);cursor:pointer;border-top:1px solid rgba(27,43,75,.08);color:var(--ink)}
.sres button:first-child{border-top:0}
.sres button:hover{background:rgba(27,43,75,.05)}
.sres .se{font-size:20px;flex:0 0 26px;text-align:center}
.sres b{display:block;font-size:14.5px;font-weight:600}
.sres small{display:block;font-size:12px;color:var(--muted)}
.sres .none{padding:14px 16px;font-size:13.5px;color:var(--muted)}
/* tuiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-height:136px;padding:16px;border-radius:22px;text-decoration:none;color:var(--ink);
  background:var(--glass);border:1px solid var(--glass-b);box-shadow:var(--glass-sh);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile .ti{font-size:30px;line-height:1;margin-bottom:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.tile .ti img{width:54px;height:54px;object-fit:contain;display:block;filter:drop-shadow(0 8px 12px rgba(0,0,0,.28))}
.tile b{font-family:var(--serif);font-size:18px;font-weight:500;line-height:1.15}
.tile small{font-size:12px;color:#5A6478;line-height:1.35}
/* maintenant */
.nowhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.nowhead .d{font-family:var(--serif);font-size:22px}
.nowlist{margin-top:8px}
.nowlist .ev{padding:11px 0}
.nowlist .ev .txt b{font-size:15.5px}
.nowlist .ev .txt p{display:none}
.tidemini{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;padding-top:12px;border-top:1px solid rgba(27,43,75,.12)}
.tidemini span{font-size:13px;color:#3E4A62}
.tidemini span.lbl{flex-basis:100%}
.tidemini b{font-family:var(--sans);font-weight:700;color:var(--navy)}
.tidemini i{font-style:normal;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;font-weight:700}
/* essentiel */
.ess{display:grid;grid-template-columns:1fr;gap:0}
.ess .row{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid rgba(27,43,75,.1)}
.ess .row:first-child{border-top:0;padding-top:0}
.ess .row .ri{flex:0 0 40px}
.ess .row .ri img{width:40px;height:40px;object-fit:contain;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.ess .row i{font-style:normal;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;font-weight:700}
.ess .row b{font-weight:600;font-size:14.5px;color:var(--ink);display:block}
.wifi{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}
.wifi .pw{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;background:rgba(27,43,75,.07);padding:3px 8px;border-radius:8px}
.wifi button,.copy button[data-reveal]{border:1px solid rgba(27,43,75,.25);background:#fff;color:var(--navy);font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.06em;padding:5px 10px;border-radius:8px;cursor:pointer}
.copy button[data-reveal]{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;margin-right:6px}
.copy .pw{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em}
.copy .act{display:flex;gap:0;flex:none}
/* près de vous / favoris */
.near{display:grid;grid-template-columns:1fr;gap:0}
.near .nr{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid rgba(27,43,75,.1)}
.near .nr:first-child{border-top:0;padding-top:2px}
.near .ne{font-size:22px;flex:0 0 30px;text-align:center}
.near .nt{flex:1;min-width:0}
.near .nt b{display:block;font-family:var(--serif);font-size:16px;font-weight:500;line-height:1.2}
.near .nt small{font-size:12px;color:var(--muted)}
.near .links{margin:0;flex:none}
.links a,.links button{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border-radius:14px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.7);cursor:pointer}
.links img{width:30px;height:30px;object-fit:contain;display:block}
.links a.web{width:auto;padding:0 14px;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--navy);text-decoration:none}
.links .fav{font-size:19px;color:#B4BAC6;line-height:1}
.links .fav.on{color:#C0392B}
.card{position:relative}
.card[data-n]{scroll-margin-top:72px}
.card.hl{animation:hl 1.6s ease-out}
@keyframes hl{0%{background:rgba(184,151,90,.28)}100%{background:transparent}}
/* univers */
.uni{display:flex;gap:6px;margin:0 0 12px;padding:4px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26)}
.uni button{flex:1;border:0;background:transparent;color:var(--on-dark);font-family:var(--sans);font-size:12.5px;font-weight:700;padding:9px 6px;border-radius:999px;cursor:pointer;white-space:nowrap}
.uni button[aria-selected="true"]{background:#fff;color:var(--navy);box-shadow:0 4px 14px rgba(8,16,32,.22)}
/* logement : raccourcis */
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 16px;padding:2px 20px 8px}
.quick::-webkit-scrollbar{display:none}
.quick a{flex:none;font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--on-dark);text-decoration:none;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);white-space:nowrap}
.quick span{flex:none;align-self:center;font-size:12px;color:var(--on-dark-2)}
.box{scroll-margin-top:72px}
/* agenda : lien activités */
.actlinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.actlinks a{font-family:var(--sans);font-size:13px;font-weight:700;color:#fff;text-decoration:none;padding:10px 16px;border-radius:999px;display:inline-flex;align-items:center;gap:8px}
.actlinks a i{width:9px;height:9px;border-radius:50%;background:#fff;opacity:.85;display:inline-block}
/* carte : les deux pastilles (« Voir tout », « Le logement ») à gauche, pour ne pas couvrir les commandes MapLibre à droite */
.mapbtns{position:absolute;top:12px;left:12px;z-index:5;display:flex;gap:6px;max-width:calc(100% - 70px);flex-wrap:wrap}
.mapbtns .mapbtn{position:static}
.mapbtns.hide{display:none}
/* pratique : deux volets (le logement / côte & région), mêmes box en verre foncé que le logement */
.pseg{margin-bottom:16px}
.pane[hidden]{display:none}
#rboxes .box .pill-links a[href^="#/"]{font-weight:700}
/* services */
.servlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.servlist span{font-size:13px;color:var(--on-dark);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:8px 14px}
.cta{padding:30px 0 10px}
/* barre basse */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(14,24,41,.70),rgba(14,24,41,.88));border-top:1px solid rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:0 -10px 30px rgba(8,16,32,.28)}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:50px;padding:5px 4px;border-radius:14px;
  font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--on-dark-2);text-decoration:none}
.bottomnav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bottomnav a.on{color:#fff;background:rgba(255,255,255,.13)}
/* accordéons / filtres / calendrier en vrais boutons */
.acc-h{width:100%;background:none;border:0;text-align:left;font:inherit;color:inherit}
.cell{font-family:var(--sans);color:var(--ink);padding:0;width:100%}
.filters button{min-height:40px}
.on-dark-link{color:#fff}
@media (min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}.near{grid-template-columns:1fr 1fr;gap:0 24px}.ess{grid-template-columns:1fr 1fr;gap:0 24px}.ess .row:nth-child(2){border-top:0;padding-top:0}}
@media (min-width:900px){.bottomnav{display:none}.topnav{display:flex}main{padding-bottom:40px}.hero{min-height:46vh}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .topbar,.bottomnav{background:rgba(14,24,41,.97)} .hcard,.tile{background:rgba(255,255,255,.95)} .search input{background:#fff}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<a class="skip" href="#main" data-i18n="skip"></a>

<header class="topbar">
  <button class="brandmark" type="button" data-go="accueil" aria-label="Eukleia — accueil">EUKLEIA</button>
  <nav class="topnav" aria-label="Sections">
    <a href="#/accueil" data-nav="accueil" data-i18n="tnHome"></a>
    <a href="#/pratique/logement" data-nav="logement" data-i18n="tnHouse"></a>
    <a href="#/explorer/decouvrir" data-nav="explorer" data-i18n="tnDisc"></a>
    <a href="#/explorer/manger" data-nav="explorer2" data-i18n="tnFood"></a>
    <a href="#/agenda" data-nav="agenda" data-i18n="tnAct"></a>
    <a href="#/pratique/region" data-nav="pratique" data-i18n="tnPrat"></a>
    <a href="#/services" data-nav="services" data-i18n="tnServ"></a>
  </nav>
  <div class="topright">
    <button class="favtop" type="button" data-go="favoris" data-i18n-aria="favT" aria-label="Mes favoris"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.4S4.2 15.6 2.9 10.9C2 7.7 4.1 4.6 7.2 4.6c2 0 3.6 1.1 4.8 2.7 1.2-1.6 2.8-2.7 4.8-2.7 3.1 0 5.2 3.1 4.3 6.3C19.8 15.6 12 20.4 12 20.4z"/></svg><span class="favn" id="favn" hidden>0</span></button>
    <div class="langbar" role="group" aria-label="Langue / Language">
      <button type="button" data-setlang="fr" class="on">FR</button>
      <button type="button" data-setlang="en">EN</button>
    </div>
  </div>
</header>

<main id="main">

<!-- ACCUEIL -->
<section class="screen" id="s-accueil" aria-labelledby="h-accueil">
  <header class="hero">
    <div class="hero-photo" id="heroPhoto"></div>
    <div class="hero-inner">
      <div class="eyebrow" data-i18n="heroEyebrow"></div>
      <h1 id="h-accueil">La Tourelle</h1>
      <div class="sub" data-i18n="heroSub"></div>
      <div class="dates" data-i18n="heroDates"></div>
    </div>
  </header>
  <div class="wrap">
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.2-4.2"/></svg>
      <input type="search" id="q" autocomplete="off" aria-label="" data-i18n-ph="searchPh" data-i18n-aria="searchLbl">
      <div class="sres" id="sres" role="listbox"></div>
    </div>
    <div class="hcard">
      <div class="eyebrow" data-i18n="scrHome"></div>
      <h3 data-i18n="welcomeT"></h3>
      <p data-i18n="welcomeTxt"></p>
    </div>
    <div class="updated" data-i18n="updated"></div>
    <nav class="tiles" aria-label="Catégories">
      <a class="tile" href="#/pratique/logement"><span class="ti"><img alt="" data-ico="house"></span><b data-i18n="scrHouse"></b><small data-i18n="tileHouseSub"></small></a>
      <a class="tile" href="#/explorer/decouvrir"><span class="ti"><img alt="" data-ico="pin"></span><b data-i18n="scrDisc"></b><small data-i18n="tileDiscSub"></small></a>
      <a class="tile" href="#/explorer/manger"><span class="ti"><img alt="" data-ico="cloche"></span><b data-i18n="scrFood"></b><small data-i18n="tileFoodSub"></small></a>
      <a class="tile" href="#/agenda"><span class="ti"><img alt="" data-ico="calendar"></span><b data-i18n="scrAct"></b><small data-i18n="tileActSub"></small></a>
      <a class="tile" href="#/pratique/region"><span class="ti"><img alt="" data-ico="clipboard"></span><b data-i18n="segRegion"></b><small data-i18n="tilePratSub"></small></a>
      <a class="tile" href="#/services"><span class="ti"><img alt="" data-ico="bell"></span><b data-i18n="scrServ"></b><small data-i18n="tileServSub"></small></a>
    </nav>
    <div class="hcard" id="now"></div>
    <div class="hcard" id="ess"></div>
    <div class="hcard" id="near"></div>
    <div class="hcard" id="favs"></div>
    <div class="hcard" style="text-align:center">
      <div class="eyebrow" data-i18n="ebConc"></div>
      <h3 data-i18n="concTitle"></h3>
      <p data-i18n="concLead"></p>
      <a class="btn" href="#" data-wa data-i18n="concBtn" style="margin-top:14px"></a>
    </div>
  </div>
</section>

function dayItems(d){
  const wd=(d-D0+WD0+70)%7;          /* 4 Aug 2026 = Tuesday */
  const out=[];
  if(SPECIALS[d]) out.push(...SPECIALS[d].filter(x=>x.kind==="maison"));
  RANGES.forEach(r=>{ if(d>=r.from&&d<=r.to) out.push({kind:r.kind,fr:r.fr,en:r.en}); });
  if(SPECIALS[d]) out.push(...SPECIALS[d].filter(x=>x.kind!=="maison"));
  if(RACE_DAYS.includes(wd)) out.push(wd===3?RACE_NIGHT:RACE);
  if(MARKET_DAYS.includes(wd)) out.push(MARKET);
  if(RECUR[wd]) out.push(...RECUR[wd]);
  return out;
}

 {cat:"table",emo:"🍷",n:"Chez Miocque",lat:49.3594216,lng:0.0730948,pid:"ChIJR54wd7HU4UcRElJz8hW-2Io",tel:"+33242050042",book:1,
  fr:"L'institution de la rue Eugène Colas, à cinq minutes à pied : une brasserie chic où Deauville se retrouve depuis des décennies — poisson du jour, belles viandes, carte des vins sérieuse, service enlevé. Ouvert tous les jours, midi et soir, ce qui rend grand service le dimanche.",
  en:"The rue Eugène Colas institution, a five-minute walk away: a smart brasserie where Deauville has met for decades — fish of the day, good meat, a serious wine list, brisk service. Open every day, lunch and dinner, which is a blessing on a Sunday."},
 {cat:"table",emo:"🐟",n:"L'Étoile des Mers",lat:49.3589325,lng:0.0766158,pid:"ChIJD3NqPa7U4UcRGiIqCCEmbRo",tel:"+33986592790",
  fr:"Une poissonnerie et, derrière l'étal, un restaurant : vous choisissez votre poisson ou votre plateau au comptoir, et il est cuisiné sous vos yeux. Rue Gambetta, à cinq minutes à pied. Hors saison, ouvert du jeudi au dimanche.",
  en:"A fishmonger with a restaurant behind the counter: choose your fish or seafood platter at the stall, and it is cooked in front of you. Rue Gambetta, a five-minute walk. Out of season, open Thursday to Sunday."},
 {cat:"table",emo:"🍝",n:"Mamma Mia",lat:49.3614852,lng:0.0820288,pid:"ChIJ58ln1zDV4UcRR28GkIIUzHk",tel:"+33231883252",
  fr:"Italien sur le quai. Simple, bon, et la réponse facile un soir où personne n'a envie d'organiser quoi que ce soit.",
  en:"Italian on the quay. Simple, good, and the easy answer on an evening when nobody wants to organise anything."},
 {cat:"table",emo:"🍣",n:"Kyo",lat:49.3601244,lng:0.0755986,pid:"ChIJ5bOmI0fV4UcR-4Yxldfq6VM",tel:"+33231817589",
  fr:"Les meilleurs sushis de la ville, et ils livrent. Une soirée à la maison avec Kyo et une bouteille rapportée du marché vaut plus que ça n'en a l'air.",
  en:"The best sushi in town, and they deliver. An evening at the house with Kyo and a bottle from the market square is worth more than it sounds."},
 {cat:"table",emo:"🦪",n:"Les Vapeurs",lat:49.3653063,lng:0.0819165,pid:"ChIJd5lnU6vU4UcRU6LthI9Zuwo",tel:"+33231881524",
  fr:"De l'autre côté du pont, à Trouville. Huîtres et moules à la crème depuis 1927 — le classique qu'on ne saute pas.",
  en:"Across the bridge in Trouville. Oysters and mussels in cream since 1927 — the classic nobody should skip."},
 {cat:"table",emo:"🐴",n:"La Toque · Hippodrome",lat:49.3533734,lng:0.0791248,pid:"ChIJPZBriK_U4UcR5bYOSht3rbI",tel:"+33231142000",book:1,
  fr:"Déjeuner à l'hippodrome, face à la piste. Un jour de courses, c'est la façon civilisée de faire : on mange pendant que les chevaux passent.",
  en:"Lunch at the racecourse, overlooking the track. On a race day this is the civilised way to do it — you eat while the horses go past."},
 {cat:"table",emo:"🍸",n:"BROK",lat:49.3580616,lng:0.0711123,pid:"ChIJrfdPKbHU4UcRC8v3UdWltGk",tel:"+33231890193",
  fr:"Bar à cocktails, de 17h à 1h. L'endroit juste pour un verre après le dîner, avec une terrasse agréable jusque tard.",
  en:"Cocktail bar, 5 pm to 1 am. The right place for a drink after dinner, with a terrace that stays pleasant late."},

 {cat:"plage",emo:"🏖️",n:"Les Planches · Deauville",lat:49.3601,lng:0.0672,pid:"ChIJzxs42bLU4UcRlDfVYIeUDFc",tel:"",
  fr:"La promenade en bois et ses parasols, avec les cabines aux noms de stars. Transats et parasols se louent sur place ; le club de plage organise des activités encadrées pour les enfants en août.",
  en:"The famous boardwalk and its parasols, with cabins named after film stars. Loungers and parasols are hired on the spot; the beach club runs supervised activities for children in August."},
 {cat:"plage",emo:"🏄",n:"Plage de Tourgéville",lat:49.3520,lng:0.0530,pid:"",tel:"",
  fr:"À cinq minutes en voiture, ou une demi-heure à pied par les Planches — plus large, plus calme et bien moins fréquentée que celle de Deauville. À marée basse le sable découvre très loin : c'est l'endroit idéal pour une première rencontre avec la mer, sans vague et sans monde.",
  en:"Five minutes by car, or half an hour on foot along Les Planches — wider, quieter and far less busy than Deauville's. At low tide the sand runs out a very long way: the ideal place for a first encounter with the sea, without waves or crowds."},
 {cat:"plage",emo:"🚤",n:"Bateau & jet-ski · Port de Deauville",lat:49.3650,lng:0.0740,pid:"ChIJfzo_zkEr4EcRGU2t64wRpow",tel:"+33769165330",book:1,
  fr:"Depuis la base de la digue Brise-Lame, au port, à un quart d'heure à pied : jet-ski en initiation ou en randonnée le long de la côte (accessible sans permis), location de bateau avec ou sans skipper, balade commentée en zodiac. Les sorties dépendent de la marée et de la météo — dites-nous quel jour vous tente et nous réservons le bon créneau.",
  en:"From the base on the Brise-Lame jetty, at the marina, a fifteen-minute walk: jet-ski taster sessions or coastal rides (no licence needed), boat hire with or without a skipper, a guided zodiac cruise. Departures depend on the tide and the weather — tell us which day tempts you and we will book the right slot."},
 {cat:"plage",emo:"🌇",n:"La Terrasse des Ammonites",lat:49.3487397,lng:0.0473982,pid:"ChIJcU7Fwd7U4UcRbUrLxuMSJKE",tel:"+33231884033",
  fr:"Au bout de la promenade, à Bénerville. Notre place pour le coucher du soleil — un cocktail vers 21h, quand toute la baie devient rose.",
  en:"At the far end of the promenade, at Bénerville. Our sunset spot — a cocktail around 9 pm as the whole bay turns pink."},
 {cat:"balade",emo:"🌊",n:"Villerville & Les Roches Noires",lat:49.4000184,lng:0.1238588,pid:"ChIJ5YuoCwAt4EcRh7qo8b8yIyE",tel:"",
  fr:"Village de pêcheurs de cinéma à quinze minutes — « Un singe en hiver » y a été tourné. Le sentier des falaises a rouvert l'an dernier, et en bas La Brise Marine sert des huîtres sur le sable. Fermé le lundi.",
  en:"A cinematic fishing village fifteen minutes away — Un singe en hiver was filmed here. The clifftop path reopened last year, and below it La Brise Marine serves oysters on the sand. Closed Mondays."},
 {cat:"balade",emo:"🐚",n:"Les Vaches Noires · Villers-sur-Mer",lat:49.3199579,lng:-0.0177423,pid:"ChIJ5XioM35_CkgRAHIIhFXI-_4",tel:"",
  fr:"À vingt minutes, les falaises sombres entre Villers et Houlgate : un chaos d'argile et de blocs, et une plage jonchée de fossiles du Jurassique — ammonites, gryphées — que l'on ramasse librement, sans creuser la falaise. Partez du front de mer de Villers, à marée basse uniquement (les horaires sont dans votre calendrier), et surveillez la remontée.",
  en:"Twenty minutes away, the dark cliffs between Villers and Houlgate: a tumble of clay and boulders, and a beach strewn with Jurassic fossils — ammonites, gryphaea — that you may pick up freely, without digging into the cliff. Start from the Villers seafront, at low tide only (the times are in your calendar), and keep an eye on the incoming sea."},
 {cat:"plage",emo:"🏊",n:"Piscine olympique de Deauville",lat:49.3600453,lng:0.0670712,pid:"ChIJbV_lIbPU4UcRLVvS_wzUcEw",tel:"+33231140217",
  fr:"Un bassin de 50 mètres d'eau de mer chauffée, sur le front de mer — la bonne réponse à un après-midi gris. Règle française : bonnet obligatoire, et maillot slip plutôt que short.",
  en:"A 50-metre pool of heated seawater on the seafront — the right answer on a grey afternoon. Note the French rule: swimming caps required, and proper trunks rather than shorts."},

 {cat:"eques",emo:"🌾",n:"Haras de Meautry",lat:49.3422282,lng:0.1050158,pid:"ChIJuXaYtmvT4UcRCig_KeXGlSo",tel:"+33231880407",
  fr:"Le haras des Rothschild, à dix minutes en voiture : un chemin de 4 km autour des paddocks, une centaine de pur-sang. Gratuit, ouvert, et la plus belle promenade du secteur — allez-y à l'aube ou au crépuscule.",
  en:"The Rothschild stud, ten minutes away by car: a 4 km path around the paddocks, past some hundred thoroughbreds. Free, open, and the loveliest walk in the area — go at dawn or at dusk."},
 {cat:"eques",emo:"🐴",n:"Haras de Beaumont",lat:49.2995363,lng:0.0624555,pid:"ChIJnUIQLJPV4UcR67wgKOj3vYQ",tel:"+33214094878",book:1,
  fr:"À Vauville, à un quart d'heure en voiture : l'un des rares haras de pur-sang qui se visitent — c'est ici qu'est stationné Ace Impact, vainqueur invaincu de l'Arc de Triomphe 2023. La visite se fait sur rendez-vous, avec présentation des étalons ; nous l'organisons pour vous.",
  en:"In Vauville, fifteen minutes by car: one of the rare thoroughbred studs that can be visited — home to Ace Impact, the unbeaten winner of the 2023 Arc de Triomphe. Visits are by appointment, with a presentation of the stallions; we arrange it for you."},
 {cat:"eques",emo:"🏟️",n:"Pôle International du Cheval Longines",lat:49.3393589,lng:0.0960744,pid:"ChIJoYNlvGXT4UcRhD3c_bKiwGE",tel:"+33231140404",
  fr:"À Saint-Arnoult, à dix minutes en voiture : le grand centre de concours de la Côte Fleurie — saut d'obstacles, dressage, des compétitions presque tous les week-ends, entrée libre. Un restaurant donne sur la carrière ; on y déjeune en regardant les parcours.",
  en:"In Saint-Arnoult, ten minutes by car: the Côte Fleurie's great competition venue — show jumping, dressage, events almost every weekend, free entry. A restaurant overlooks the arena; lunch there while the rounds go by."},
 {cat:"eques",emo:"🏇",n:"Hippodrome de Deauville-La Touques",lat:49.3533734,lng:0.0791248,pid:"ChIJPZBriK_U4UcR5bYOSht3rbI",tel:"+33231142000",
  fr:"L'hippodrome historique, en plein cœur de la ville, à dix minutes à pied de la maison : courses de plat sur gazon et sur piste en sable fibré une grande partie de l'année. Entrée à quelques euros, enfants gratuits, animations gratuites les jours de courses — les réunions figurent dans votre calendrier.",
  en:"The historic racecourse, right in the heart of town and a ten-minute walk from the house: flat racing on turf and on the all-weather track for much of the year. Entry costs a few euros, children go free, and race days come with free entertainment — the meetings appear in your calendar."},
 {cat:"eques",emo:"🌳",n:"Hippodrome de Clairefontaine",lat:49.3447532,lng:0.0531103,pid:"ChIJzZwWRcLU4UcR_TzHaWpJUls",tel:"+33231146900",
  fr:"L'autre hippodrome, à Tourgéville, à dix minutes : un champ de courses de campagne, colombages et jardins fleuris, le seul de la région à courir en plat, en obstacles et au trot. Réunions l'été et au début de l'automne, l'ambiance la plus douce des deux.",
  en:"The other racecourse, in Tourgéville, ten minutes away: a country track of half-timbering and flower gardens, the only one in the region to run flat, jumps and trotting. Meetings in summer and early autumn, and the gentler atmosphere of the two."},
 {cat:"eques",emo:"🐎",n:"La Mangeoire · Club hippique de Deauville",lat:49.3616654,lng:0.0705214,pid:"ChIJndtyjLbU4UcR7KLM9mDS_C0",tel:"+33231985624",book:1,url:"https://la-mangeoire-deauville.fr/fr/",urlT:{fr:"Balades & tarifs",en:"Rides & prices"},
  fr:"Le club hippique de la ville, derrière les Planches, à un quart d'heure à pied : balades à cheval sur la plage, débutants acceptés, départs calés sur les marées. À réserver quelques jours à l'avance ; nous nous en chargeons.",
  en:"The town's riding club, behind the Planches and a fifteen-minute walk away: horse rides on the beach, beginners welcome, departures set by the tides. Book a few days ahead; we take care of it."},
 {cat:"eques",emo:"🌄",n:"Domaine de l'Atlas",lat:49.28236,lng:0.0786983,pid:"ChIJK_kiN4vX4UcR9FFU2PxPQks",tel:"+33663769962",book:1,url:"https://www.domaine-de-l-atlas.com/",urlT:{fr:"Balades & tarifs",en:"Rides & prices"},
  fr:"À Glanville, à un quart d'heure en voiture : la ferme équestre de Virginie, monitrice diplômée, pour des balades dans les vallons du Pays d'Auge — une heure pour les débutants, deux heures jusqu'à Beaumont-en-Auge, ou la balade gourmande avec dégustation chez un producteur. Sur réservation.",
  en:"In Glanville, fifteen minutes by car: Virginie's riding farm, with a qualified instructor, for rides through the valleys of the Pays d'Auge — an hour for beginners, two hours as far as Beaumont-en-Auge, or the gourmet ride with a tasting at a local producer. By reservation."},
 {cat:"eques",emo:"🔨",n:"Arqana · le ring des ventes",lat:49.3536404,lng:0.0719351,pid:"ChIJ5y7-qrvU4UcR4FDQEw9-Zj8",tel:"+33231818100",
  fr:"La première maison de ventes de chevaux de course en Europe, à côté de l'hippodrome et à dix minutes à pied de la maison. Pas de vente pendant votre séjour — les prochaines ont lieu plus tard dans le mois — mais le site, ouvert sur l'avenue, vaut le détour.",
  en:"Europe's leading racehorse auction house, beside the racecourse and a ten-minute walk from the house. No sale during your stay — the next ones come later in the month — but the grounds, open onto the avenue, are worth the detour."},

 {cat:"signature",emo:"🚁",n:"Vol panoramique sur la Normandie",lat:49.3647496,lng:0.1560690,pid:"ChIJCe_bsLTS4UcRUb2bClQyDTc",tel:"+33231656565",book:1,
  fr:"À dix minutes de la maison, l'aérodrome de Deauville–Saint-Gatien, d'où toute la région s'ouvre vue du ciel. Trois routes : le pont de Normandie (15 min environ), les falaises d'Étretat par l'estuaire (30 min environ), ou la côte Fleurie. Cinq à six passagers, commentaires au casque, enfants bienvenus. Ce qu'on peut faire de plus extraordinaire ici.",
  en:"Ten minutes from the house is Deauville–Saint-Gatien airfield, and from there the whole region opens up from the air. Three routes: the Pont de Normandie (about 15 min), the Étretat cliffs by way of the estuary (about 30 min), or the Côte Fleurie coastline. Five or six passengers, commentary through headsets, children welcome. The single most extraordinary thing you can do here."},
 {cat:"signature",emo:"🏛️",n:"Villa Strassburger",lat:49.3510673,lng:0.0743214,pid:"ChIJ58XMiaPU4UcR_baUGAUP2DU",tel:"+33231882044",book:1,
  fr:"Construite en 1907 pour le baron Henri de Rothschild, sur un terrain de la famille de Flaubert, puis maison du magnat de presse américain Ralph Strassburger. Rare parmi ces villas, elle a tout gardé : le mobilier d'origine, les tableaux de chevaux, les caricatures des réceptions. Visites guidées seulement, sur réservation — nous vous obtenons un créneau.",
  en:"Built in 1907 for Baron Henri de Rothschild, on land that belonged to Flaubert's family, and later home to the American press magnate Ralph Strassburger. Rare among such houses, it kept everything: the original furniture, the horse paintings, the caricatures of its parties. Guided tours only, by booking — we will secure a slot."},
 {cat:"signature",emo:"🍏",n:"Distillerie Christian Drouin",lat:49.3045727,lng:0.1653163,pid:"ChIJzyXNOQrS4UcRW3t6i--Iv7o",tel:"+33231643005",
  fr:"À vingt minutes dans les terres, dans des bâtiments à colombages du XVIIᵉ : cidre, pommeau et calvados, faits comme il faut. La visite dure une heure et la dégustation est généreuse. Fermé le dimanche.",
  en:"Twenty minutes inland, in 17th-century half-timbered buildings: cider, pommeau and calvados, made properly. The tour takes an hour and the tasting is generous. Closed Sundays."},
 {cat:"signature",emo:"🚗",n:"La Normandie en 2CV",lat:49.294765,lng:0.184868,pid:"ChIJW6kXWOHN4UcRBL2-oM83eQc",tel:"+33681387308",book:1,
  fr:"À Pont-l'Évêque, à vingt minutes : on vous confie une 2CV décapotée et un carnet de route, et vous partez pour une demi-journée ou une journée dans le Pays d'Auge — manoirs à colombages, Route du Cidre, dégustations chez les producteurs. Plusieurs voitures pour un groupe, rallye possible. Nous réservons.",
  en:"In Pont-l'Évêque, twenty minutes away: you are handed an open-top 2CV and a road book, and off you go for a half-day or a full day in the Pays d'Auge — half-timbered manors, the Cider Route, tastings at the producers. Several cars for a group, rally format available. We book it."},
 {cat:"excursion",emo:"🏰",n:"Mont-Saint-Michel",lat:48.6359569,lng:-1.5117405,pid:"ChIJHdzEgyGpDkgR4cESJdSzFjU",tel:"+33233898000",book:1,
  fr:"À deux heures de route — la grande journée du séjour si le cœur vous en dit. Partez avant 9h, visitez l'abbaye en fin de matinée, et revenez par Cancale pour les huîtres. Nous organisons un chauffeur si vous préférez la route contemplative.",
  en:"About two hours by road — the big day out of the stay, if the heart says yes. Leave before 9 am, visit the abbey late in the morning, and come back by way of Cancale for oysters. We arrange a driver if you would rather enjoy the road."},
 {cat:"balade",emo:"⛰️",n:"Mont Canisy",lat:49.3335,lng:0.0455,pid:"ChIJAcvfJfDU4UcRMdSEpwkV-oc",tel:"",
  fr:"Le point haut de la côte, au-dessus de Bénerville : bunkers de la batterie, panorama du Havre à Cabourg, et une lumière de fin de journée qui vaut le déplacement. Balade facile d'une heure.",
  en:"Atlantic Wall bunkers and a panorama of the whole bay, just above the golf course. An hour on foot, shade and silence — the underground galleries can be visited on guided tours."},
 {cat:"balade",emo:"⛵",n:"Trouville & le Bac",lat:49.3665,lng:0.0842,pid:"",tel:"",
  fr:"Le petit bac traverse l'estuaire en deux minutes, depuis le port — un quart d'heure à pied. De l'autre côté : la halle aux poissons ouverte tous les jours, la rue des Bains et ses galeries, et Les Vapeurs pour les moules à la crème.",
  en:"The little ferry crosses the estuary in two minutes, from the marina — a fifteen-minute walk. On the other side: the fish market, open daily, and rue des Bains with its galleries."},

 {cat:"culture",emo:"🖼️",n:"Les Franciscaines",lat:49.3544194,lng:0.0666102,pid:"ChIJT_Hx4ALV4UcR84ZQLWCXN38",tel:"+33261522920",
  fr:"Ancien couvent devenu musée et bibliothèque, cinq ans cette année — l'un des plus beaux bâtiments de la ville. Cet automne : le festival de photographie Planches Contact, jusqu'au 3 janvier, et les jardins peints d'André Hambourg. Ouvert du mardi au dimanche, 10h30–18h30. Le Réfectoire sert le goûter et le brunch du dimanche. Fermé le lundi.",
  en:"A former convent turned museum and library, five years old this year — one of the finest buildings in town. This autumn: the Planches Contact photography festival, until 3 January, and André Hambourg's painted gardens. Open Tuesday to Sunday, 10.30 am–6.30 pm. Le Réfectoire serves afternoon tea and a Sunday brunch. Closed Mondays."},

 {cat:"excursion",emo:"⚓",n:"Honfleur",lat:49.420192,lng:0.2331910,pid:"ChIJIQIjZUEz4EcRg0ABmlMekGQ",tel:"",
  fr:"Vingt-cinq minutes par la route de la côte, via Villerville. Le Vieux Bassin et ses maisons hautes et étroites, l'église en bois Sainte-Catherine, les galeries, et la serre aux papillons de Naturospace.",
  en:"Twenty-five minutes along the coast road, by way of Villerville. The Vieux Bassin with its tall narrow houses, Sainte-Catherine's wooden church, the galleries, and the butterfly house at Naturospace."},
 {cat:"excursion",emo:"🪨",n:"Étretat",lat:49.7070059,lng:0.1927472,pid:"ChIJh1OKtnUX4EcRcOt7zftRVIc",tel:"",
  fr:"Les falaises de craie, l'Aiguille et l'arche de la Manneporte — environ une heure et quart de route. Partez tôt ou tard : la lumière sur les falaises est tout l'intérêt, et le milieu de journée, le week-end, est le moment le plus chargé. Les jardins d'Étretat, au-dessus du village, valent la montée.",
  en:"The white chalk cliffs, the Aiguille and the Manneporte arch — about an hour and a quarter by car. Go early or late; the light on the cliffs is the whole point, and the middle of a weekend day is the busiest. The clifftop gardens above the town are worth the climb."},
 {cat:"excursion",emo:"🕊️",n:"Mémorial de Caen",lat:49.1973431,lng:-0.3839795,pid:"ChIJ_xx3xdNCCkgR8TE3Chq2xA8",tel:"+33231060644",book:1,
  fr:"À une heure, le grand musée d'histoire de la région : la Seconde Guerre mondiale, le Débarquement et le chemin vers la paix en Europe, racontés avec soin. C'est aussi d'ici que partent les visites guidées des plages, avec chauffeur.",
  en:"An hour away, the region's great history museum: the Second World War, the landings, and the road to peace in Europe, told carefully. Guided tours of the landing beaches also leave from here, with a driver."},
 {cat:"excursion",emo:"⛪",n:"Basilique de Lisieux",lat:49.1395821,lng:0.2363703,pid:"ChIJBQndWz3E4UcRLhl06bEVfoE",tel:"+33231485500",
  fr:"À quarante minutes : l'immense basilique Sainte-Thérèse, l'un des plus grands sanctuaires de France, dressée sur sa colline — mosaïques, crypte, et la vue sur le Pays d'Auge depuis le parvis. Une heure suffit ; combinez avec Beuvron-en-Auge et la Route du Cidre au retour. Ouvert tous les jours.",
  en:"Forty minutes away: the immense basilica of Saint Thérèse, one of the largest shrines in France, set on its hill — mosaics, the crypt, and the view over the Pays d'Auge from the forecourt. An hour is enough; combine it with Beuvron-en-Auge and the Cider Route on the way back. Open every day."},
 {cat:"excursion",emo:"🎖️",n:"Plages du Débarquement · Arromanches & Omaha",lat:49.3402043,lng:-0.6209964,pid:"ChIJ4ZZv7txVCkgRW_p2vFRfqUs",tel:"+33231223431",book:1,
  fr:"À une heure et quart : Arromanches et les vestiges du port artificiel, puis Omaha Beach et le cimetière américain de Colleville, au-dessus de la mer. Une journée grave et belle, à commencer par le Mémorial de Caen si vous aimez le contexte. Nous organisons un guide et un chauffeur.",
  en:"An hour and a quarter away: Arromanches and the remains of the artificial harbour, then Omaha Beach and the American cemetery at Colleville, above the sea. A grave and beautiful day, best begun at the Mémorial de Caen if you like the context. We arrange a guide and a driver."},
 {cat:"excursion",emo:"⚔️",n:"Château de Falaise · Guillaume le Conquérant",lat:48.8932137,lng:-0.2039427,pid:"ChIJoZCjjGUQCkgR0OLfxMpaZIE",tel:"+33231416144",
  fr:"À une heure et quart : la forteresse où naquit Guillaume le Conquérant, trois donjons restaurés dominant la ville. La visite se fait tablette en main, qui recrée les salles telles qu'elles étaient — l'une des mises en scène les plus réussies de Normandie. Comptez deux heures.",
  en:"An hour and a quarter away: the fortress where William the Conqueror was born, three restored keeps towering over the town. You visit with a tablet in hand that recreates the rooms as they once were — one of the most successful stagings in Normandy. Allow two hours."},
 {cat:"excursion",emo:"🏛️",n:"Abbaye de Jumièges",lat:49.4317195,lng:0.8180885,pid:"ChIJN4HWcG784EcRZn7HZfU_rXk",tel:"+33235372402",
  fr:"À une heure et quart, dans une boucle de la Seine : les ruines blanches de la plus belle abbaye de Normandie, deux tours de 46 mètres ouvertes sur le ciel. Une heure de visite, puis la route des abbayes et les villages de la vallée. L'abbaye ferme certains jours en basse saison : nous vérifions avant votre départ.",
  en:"An hour and a quarter away, in a loop of the Seine: the white ruins of Normandy's most beautiful abbey, two 46-metre towers open to the sky. An hour's visit, then the abbey road and the villages of the valley. The abbey closes on some days out of season: we check before you set off."},

let lang = new URLSearchParams(location.search).get('lang')==='en' ? 'en' : 'fr';
let curDay = 7, sel='all', active = new Set(CATS.map(c=>c.id)), map=null, markers=[];
function syncActive(){active=new Set(sel==='all'?pool():[sel]);}
const D0=7, D1=9, WD0=5;
function catColor(id){return CATS.find(c=>c.id===id).c;}
function dispD(d){return d;}
function dispM(d,lg){return T[lg].month;}
function dispDay(d,lg){return (d===1&&lg==='fr')?'1er':String(d);}
function todayVirtual(t){if(t.getFullYear()!==2026)return null;if(t.getMonth()===10)return t.getDate();return null;}

function applyStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.getAttribute('data-i18n'); if(T[lang][k]) el.textContent=T[lang][k];
  });
  document.querySelectorAll('[data-setlang]').forEach(b=>b.classList.toggle('on',b.dataset.setlang===lang));
  document.querySelectorAll('[data-wa]').forEach(a=>a.href="https://wa.me/33651669485?text="+encodeURIComponent(T[lang].waMsg));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=T[lang][el.getAttribute('data-i18n-ph')]||'');
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',T[lang][el.getAttribute('data-i18n-aria')]||''));
  document.querySelectorAll('.pw').forEach(p=>{p.dataset.shown='0';p.textContent='••••••••••';});
  document.getElementById('vAll').textContent=T[lang].vAll;
  document.getElementById('vHome').textContent=T[lang].scrHouse;
  document.getElementById('prevDay').textContent=T[lang].prev;
  document.getElementById('nextDay').textContent=T[lang].next;
}

function renderCal(){
  const hd=document.getElementById('calhead'); hd.innerHTML='';
  T[lang].dows.forEach(d=>{const e=document.createElement('div');e.textContent=d;hd.appendChild(e);});
  const g=document.getElementById('calgrid'); g.innerHTML='';
  for(let b=0;b<WD0;b++){const e=document.createElement('div');e.style.visibility='hidden';g.appendChild(e);}
  const today=new Date();
  const tD=todayVirtual(today);
  for(let d=D0;d<=D1;d++){
    const kinds=[...new Set(dayItems(d).map(x=>x.kind))].filter(k=>k!=='closed').slice(0,4);
    const c=document.createElement('button'); c.type='button';
    c.className='cell'+(d===curDay?' on':'')+((tD===d)?' today':''); c.setAttribute('aria-pressed',d===curDay?'true':'false'); c.setAttribute('aria-label',T[lang].dowsLong[(d-D0+WD0+70)%7]+' '+dispDay(d,lang)+' '+dispM(d,lang));
    c.innerHTML=`<span class="num">${dispD(d)}</span><span class="dots">${
      kinds.map(k=>`<i style="background:${KIND_COLOR[k]}"></i>`).join('')}</span>`;
    c.onclick=()=>{curDay=d;renderCal();renderDay();};
    g.appendChild(c);
  }
  const lg=document.getElementById('callegend');
  lg.innerHTML=['race','polo','market','fete','culture','maison'].map(k=>
    `<span><i style="background:${KIND_COLOR[k]}"></i>${T[lang].kinds[k]}</span>`).join('');
}

  var W=600,H=100,ev=D.e,f=ev[0],l=ev[ev.length-1];
  var pts=[{t:f.t-372,h:f.y==="H"?1.4:8.2}].concat(ev,[{t:l.t+372,h:l.y==="H"?1.4:8.2}]);
  function yOf(m){return H-6-((m-0.5)/8.4)*(H-24);}
  var path="",x,t,i,a,b,r,hh;
  for(x=0;x<=W;x+=4){
    t=(x/W)*1440; i=0;
    while(i<pts.length-2 && pts[i+1].t<t) i++;
    a=pts[i]; b=pts[i+1];
    r=Math.min(1,Math.max(0,(t-a.t)/(b.t-a.t)));
    hh=a.h+(b.h-a.h)*(1-Math.cos(Math.PI*r))/2;
    path+=(x?"L":"M")+x.toFixed(1)+","+yOf(hh).toFixed(1);
  }
  var marks=ev.map(function(e){
    var X=(e.t/1440)*W, Y=yOf(e.h), up=e.y==="H";
    return '<circle cx="'+X.toFixed(1)+'" cy="'+Y.toFixed(1)+'" r="4.5" fill="'+(up?"#22355B":"#B8975A")+'"/>'+
      '<text x="'+X.toFixed(1)+'" y="'+(up?Y-13:Y+22).toFixed(1)+'" text-anchor="middle" style="font-size:12px;font-weight:700;fill:'+(up?"#22355B":"#8A7238")+'">'+hhmm(e.t)+'</text>';
  }).join("");
  var grid=[0,6,12,18,24].map(function(hr){
    var X=(hr/24)*W;
    return '<line x1="'+X+'" y1="-4" x2="'+X+'" y2="'+H+'" stroke="#E6E0D3" stroke-width="1"/>'+
      '<text x="'+X+'" y="'+(H+15)+'" text-anchor="'+(hr===0?"start":hr===24?"end":"middle")+'" style="font-size:10px;fill:#9AA1AC">'+String(hr%24).padStart(2,"0")+'h</text>';
  }).join("");
  var list=ev.map(function(e){
    return '<div><i>'+(e.y==="H"?T[lang].tideHigh:T[lang].tideLow)+'</i><b>'+hhmm(e.t)+'</b> <span style="color:#6E7686;font-size:12.5px">'+e.h.toFixed(2)+' m</span></div>';
  }).join("");
  return '<div class="tide"><div class="th"><b>'+T[lang].tideT+'</b><span>'+T[lang].tideCoef+' '+D.c.join(" · ")+'</span></div>'+
    '<svg viewBox="0 -18 '+W+' '+(H+40)+'" preserveAspectRatio="none" style="font-family:Manrope,sans-serif">'+grid+
    '<path d="'+path+'L'+W+','+(H+18)+'L0,'+(H+18)+'Z" fill="rgba(34,53,91,.08)"/>'+
    '<path d="'+path+'" fill="none" stroke="#22355B" stroke-width="2.2" stroke-linejoin="round"/>'+marks+'</svg>'+
    '<div class="tl">'+list+'</div></div>';
}

function renderDay(){
  const wd=(curDay-D0+WD0+70)%7;
  const items=dayItems(curDay);
  const p=document.getElementById('daypanel');
  p.innerHTML=`<div class="dh"><span class="dow">${T[lang].dowsLong[wd]}</span></div>
    <h3>${dispDay(curDay,lang)+' '+dispM(curDay,lang)}</h3>
    ${renderTide(curDay)}
    ${items.length?'':`<div class="dlead">${T[lang].nothing}</div>`}
    ${items.map(x=>`<div class="ev"><div class="bar" style="background:${KIND_COLOR[x.kind]}"></div>
      <div class="txt"><span class="k" style="color:${KIND_COLOR[x.kind]}">${T[lang].kinds[x.kind]}</span>
      <b>${x[lang].t}</b><p>${x[lang].d}</p></div></div>`).join('')}`;
  document.getElementById('prevDay').disabled=curDay<=D0;
  document.getElementById('nextDay').disabled=curDay>=D1;
}

function renderFilters(){
  const f=document.getElementById('filters'); f.innerHTML='';
  const mk=(id,label,color,count)=>{
    const b=document.createElement('button'); b.type='button';
    b.className=(id==='all'?'all':'')+(sel===id?' on':''); b.setAttribute('aria-pressed',sel===id?'true':'false');
    b.innerHTML=(color?`<i style="background:${color}"></i>`:'')+`<span>${label}</span><em>${count}</em>`;
    if(sel===id&&color) b.style.background=color;
    b.onclick=()=>{sel=(id==='all'||sel===id)?'all':id;syncActive();renderFilters();renderMarkers();renderAccs();syncHash('explorer/'+uni+(sel==='all'?'':'/'+sel));
      if(map){ if(sel==='all') setView('close'); else fitActive(); }
      const on=f.querySelector('button.on'); if(on&&!on.classList.contains('all')) on.scrollIntoView({inline:'nearest',block:'nearest',behavior:'smooth'});};
    f.appendChild(b);
  };
  const pl=pool();
  mk('all',T[lang].filtAll,null,P.filter(p=>pl.includes(p.cat)).length);
  CATS.filter(c=>pl.includes(c.id)).forEach(c=>{const n=P.filter(p=>p.cat===c.id).length; if(n) mk(c.id,T[lang].cats[c.id],c.c,n);});
}

function renderAccs(){
  const w=document.getElementById('accs');
  const open=[...w.querySelectorAll('.acc.open')].map(a=>a.dataset.cat);
  w.innerHTML='';
  if(sel!=='all'){
    const n=document.createElement('div'); n.className='filtnote';
    n.innerHTML=`<span>${T[lang].filtNote} <b>${T[lang].cats[sel]}</b></span><button type="button">${T[lang].filtReset}</button>`;
    n.querySelector('button').onclick=()=>{sel='all';syncActive();renderFilters();renderMarkers();renderAccs();if(map)setView('close');};
    w.appendChild(n);
  }
  CATS.filter(c=>active.has(c.id)).forEach((c,i)=>{
    const items=P.filter(p=>p.cat===c.id); if(!items.length) return;
    const d=document.createElement('div'); d.className='acc'; d.dataset.cat=c.id;
    if(sel!=='all'||open.includes(c.id)||(open.length===0&&i===0)) d.classList.add('open');
    d.innerHTML=`<button type="button" class="acc-h" aria-expanded="${d.classList.contains('open')}"><span class="dot" style="background:${c.c}"></span>
      <b>${T[lang].cats[c.id]}</b><span class="cnt">${items.length}</span><span class="chev" aria-hidden="true">▾</span></button>
      <div class="acc-b">${items.map(cardHTML).join('')}</div>`;
    d.querySelector('.acc-h').onclick=()=>{d.classList.toggle('open');d.querySelector('.acc-h').setAttribute('aria-expanded',d.classList.contains('open'));};
    w.appendChild(d);
  });
}
function renderMarkers(){
  markers.forEach(m=>m.remove()); markers=[];
  if(!map) return;
  P.filter(p=>active.has(p.cat)).forEach(p=>{
    const el=document.createElement('div'); el.className='pin';
    el.style.borderColor=catColor(p.cat); el.textContent=p.emo;
    const pop=new maplibregl.Popup({offset:18}).setHTML(
      `<b>${p.n}</b><div style="font-size:13px;color:#5a6272;margin:6px 0 8px">${p[lang]}</div>
       <a href="${gmaps(p)}" target="_blank" style="font-size:12px;font-weight:700;color:${catColor(p.cat)}">${T[lang].route} →</a>
       ${p.pid?`<a href="${gbiz(p)}" target="_blank" style="font-size:12px;font-weight:700;color:${catColor(p.cat)};margin-left:10px">${T[lang].gbiz} →</a>`:''}`);
    markers.push(new maplibregl.Marker({element:el}).setLngLat([p.lng,p.lat]).setPopup(pop).addTo(map));
  });
}

/* ---- Eukleia map styling: cream land, deep navy water, extruded buildings ---- */
function recolor(){
  const st=map.getStyle(); if(!st||!st.layers) return;
  st.layers.forEach(function(l){
    const id=l.id.toLowerCase();
    function set(prop,val){ try{ map.setPaintProperty(l.id,prop,val); }catch(e){} }
    if(l.type==='background'){ set('background-color','#F3EEE3'); }
    if(l.type==='fill'){
      if(id.indexOf('water')>-1) set('fill-color','#22355B');
      else if(/landcover|park|grass|wood|forest|cemetery|golf/.test(id)) set('fill-color','#E9EDE0');
      else if(/sand|beach/.test(id)) set('fill-color','#F0E4C8');
      else if(id.indexOf('building')>-1) set('fill-opacity',0);
      else if(/residential|landuse/.test(id)) set('fill-color','#F1EBDD');
    }
    if(l.type==='line'){
      if(id.indexOf('water')>-1||id.indexOf('river')>-1) set('line-color','#2B4066');
      else if(/motorway|trunk|primary/.test(id)) set('line-color','#D9C69A');
      else if(/road|street|minor|secondary|tertiary|path|rail|bridge|tunnel/.test(id)) set('line-color','#E7DCC6');
      else if(/boundary|admin/.test(id)) set('line-color','#C4B9A2');
    }
    if(l.type==='symbol'){
      if(/poi|airport|housen|shield/.test(id)){ try{ map.setLayoutProperty(l.id,'visibility','none'); }catch(e){} }
      set('text-color','#16233F'); set('text-halo-color','#F7F4EF'); set('text-halo-width',1.2);
    }
  });
  try{
    const bl=st.layers.filter(function(l){return l['source-layer']==='building';})[0];
    const src=bl?bl.source:Object.keys(st.sources).filter(function(k){return st.sources[k].type==='vector';})[0];
    if(src&&!map.getLayer('eukleia-3d')){
      map.addLayer({id:'eukleia-3d',type:'fill-extrusion',source:src,'source-layer':'building',minzoom:12.5,
        paint:{'fill-extrusion-color':'#E6DDC9',
               'fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],9],
               'fill-extrusion-base':['coalesce',['get','render_min_height'],0],
               'fill-extrusion-opacity':0.9}});
    }
  }catch(e){}
}

let mapReady=false;
function mapFail(){
  const m=document.getElementById('map');
  m.classList.add('mapfail');
  m.innerHTML=`<h4>${T[lang].mapFailT}</h4><p>${T[lang].mapFailD}</p>
    <a href="https://www.google.com/maps/search/?api=1&query=${HOME.lat},${HOME.lng}" target="_blank" rel="noopener">${T[lang].mapFailB}</a>`;
  document.querySelectorAll('.mapbtns').forEach(v=>v.classList.add('hide'));
}
function initMap(){
  if(mapReady) return; mapReady=true;
  if(typeof maplibregl==='undefined'){ mapFail(); return; }
  try{
    const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',
      center:[0.0740,49.3590],zoom:12.2,pitch:55,bearing:-16,maxPitch:70,
      attributionControl:{compact:true}});
    map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
    map.on('load',function(){
      recolor();
      const home=document.createElement('div'); home.className='pin';
      home.style.borderColor='#1B2B4B'; home.style.background='#1B2B4B'; home.textContent='🏡';
      new maplibregl.Marker({element:home}).setLngLat([HOME.lng,HOME.lat])
        .setPopup(new maplibregl.Popup({offset:18}).setHTML(
          `<b>${HOME.label}</b><div style="font-size:13px;color:#5a6272">${HOME.sub}</div>`)).addTo(map);
      renderMarkers();
      if(!reduce){ map.flyTo({center:[0.0730,49.3565],zoom:13.6,pitch:57,bearing:-20,duration:2600,essential:false}); }
    });
  }catch(e){ mapFail(); }
}
(function(){
  const st=document.getElementById('map');
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ initMap(); io.disconnect(); } });
    },{rootMargin:'300px'});
    io.observe(st);
  } else { initMap(); }
})();

function fitActive(){
  if(!map) return;
  const pts=P.filter(p=>active.has(p.cat));
  const b=new maplibregl.LngLatBounds([HOME.lng,HOME.lat],[HOME.lng,HOME.lat]);
  pts.forEach(p=>b.extend([p.lng,p.lat]));
  map.easeTo({pitch:0,bearing:0,duration:500});
  setTimeout(()=>map.fitBounds(b,{padding:{top:70,bottom:40,left:40,right:40},duration:1200,maxZoom:14.5}),300);
}
function setView(v){
  if(!map) return;
  if(v==='close'){ map.flyTo({center:[0.0730,49.3565],zoom:13.6,pitch:57,bearing:-20,duration:1400}); }
  else fitActive();
}

  const fallback=()=>{try{const ta=document.createElement('textarea');ta.value=b.dataset.copy;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');document.body.removeChild(ta);done(ok);}catch(err){done(false);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(b.dataset.copy).then(()=>done(true)).catch(fallback);} else fallback();
});
document.getElementById('shareBtn').onclick=e=>{
  e.preventDefault();
  const url=location.href.split('#')[0];
  const fb=()=>{try{navigator.clipboard.writeText(url).then(()=>{const o=e.currentTarget.textContent;e.currentTarget.textContent=T[lang].copied;setTimeout(()=>e.currentTarget.textContent=o,1400);});}catch(err){}};
  if(navigator.share){ navigator.share({title:'La Tourelle · Eukleia',url}).catch(()=>{}); } else fb();
};

/* ---- distance ---- */
function distM(p){const R=6371000,r=Math.PI/180,dl=(p.lat-HOME.lat)*r,dg=(p.lng-HOME.lng)*r,a=Math.sin(dl/2)**2+Math.cos(HOME.lat*r)*Math.cos(p.lat*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(a));}
function fmtD(m){return m<950?Math.round(m/10)*10+' m':(m/1000).toFixed(1).replace('.',lang==='fr'?',':'.')+' km';}

function norm(s){return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
const SYN={'b-arrivee':'arrivee cles check-in checkin keys arrival','b-parking':'parking garage voiture car box place','b-wifi':'wifi wi-fi internet mot de passe password code','b-alfie':'chien alfie animal plage laisse veterinaire gamelle dog pet beach lead leash vet',

  'p-health':'pharmacie medecin hopital docteur garde pharmacy doctor hospital','p-train':'gare train sncf transport bus','p-tide':'maree marees tide tides horaires coefficient','p-weather':'meteo weather pluie temps forecast','p-safe':'securite falaises baignade safety cliffs'};
function searchIndex(){
  const ix=[];
  P.forEach(p=>ix.push({e:p.emo,t:p.n,s:T[lang].cats[p.cat],k:norm(p.n+' '+p[lang]+' '+T[lang].cats[p.cat]),go:'#/explorer/all/'+p.cat,n:p.n}));

  ix.push({e:'📅',t:T[lang].calTitle,s:T[lang].scrAct,k:norm(T[lang].calTitle+' agenda calendrier calendar courses races marée tide '+T[lang].scrAct),go:'#/agenda'});
  ix.push({e:'🛎️',t:T[lang].concTitle,s:T[lang].scrServ,k:norm(T[lang].concTitle+' whatsapp conciergerie concierge '+T[lang].servItems),go:'#/services'});
  ix.push({e:'🗺️',t:T[lang].mapTitle,s:T[lang].exploreT,k:norm(T[lang].mapTitle+' carte map explorer'),go:'#/explorer'});

/* ---- routage : piloté en JS, l'ancre n'est qu'un reflet (les visionneuses intégrées bloquent history/ancres) ---- */
const SCREENS=['accueil','explorer','agenda','pratique','services','favoris'];
let pendingCard=null, curPath='';
function syncHash(p){ curPath=p; try{ if(location.hash!=='#/'+p) history.replaceState(null,'',(location.search||'')+'#/'+p); }catch(e){} }
function navTo(p){ curPath=(p||'accueil').replace(/^#\/?/,''); syncHash(curPath); route(); }
function route(){
  let h=curPath; let parts=h.split('/').filter(Boolean);
  if(parts[0]==='logement') parts=['pratique','logement'].concat(parts.slice(1)); /* ancien chemin #/logement/b-… */
  let s=parts[0]||'accueil'; if(!SCREENS.includes(s)) s='accueil';
  let navKey=s, anchor=null;
  if(s==='explorer'){
    const u=parts[1]||'all', c=parts[2]||'all';
    uni=UNIV[u]?u:'all'; sel=(c!=='all'&&CATS.find(x=>x.id===c)&&pool().includes(c))?c:'all';
    if(uni==='manger') navKey='explorer2';
    syncActive(); renderUni(); renderFilters(); renderAccs(); renderMarkers();
  }
  if(s==='pratique'){
    let seg=parts[1]||'', id=parts[2]||'';
    if(seg&&!PSEG.includes(seg)){ id=seg; seg=''; }                 /* ancien chemin #/pratique/p-… */
    const el=id?document.getElementById(id):null;
    if(el&&el.closest('.pane')){ seg=el.closest('.pane').id.replace('pane-',''); anchor=el; }
    if(PSEG.includes(seg)) pseg=seg;                                   /* sans volet : on garde le dernier ouvert */
    renderPseg(); showPane(); navKey=pseg==='logement'?'logement':'pratique';
  }
  if(s==='favoris'){ renderFavs(); navKey=''; }
  SCREENS.forEach(k=>{const el=document.getElementById('s-'+k); if(!el) return; const on=k===s; el.classList.toggle('on',on); el.hidden=!on;});
  document.querySelectorAll('[data-nav]').forEach(a=>{const on=a.dataset.nav===navKey||(!a.closest('.topnav')&&((a.dataset.nav==='explorer'&&s==='explorer')||(a.dataset.nav==='pratique'&&s==='pratique')));a.classList.toggle('on',on); if(on)a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');});
  document.querySelectorAll('.favtop').forEach(b=>{ b.classList.toggle('on',s==='favoris'); if(s==='favoris') b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if(s==='explorer'&&map){ setTimeout(()=>{ map.resize(); if(sel!=='all'||uni!=='all') fitActive(); },60); }
  window.scrollTo({top:0,behavior:'auto'});
  if(anchor){ setTimeout(()=>anchor.scrollIntoView({block:'start',behavior:'smooth'}),40); }
  if(s==='explorer'&&pendingCard){ const n=pendingCard; pendingCard=null; setTimeout(()=>{ const c=[...document.querySelectorAll('#accs .card')].find(x=>x.dataset.n===n); if(c){ c.closest('.acc').classList.add('open'); c.scrollIntoView({block:'center',behavior:'smooth'}); c.classList.add('hl'); } },80); }
  const main=document.getElementById('main'); if(main) main.setAttribute('aria-label',T[lang]['scr'+({accueil:'Home',explorer:'Disc',agenda:'Act',pratique:'Prat',services:'Serv',favoris:'Fav'})[s]]||'');
}
window.addEventListener('hashchange',()=>{ const p=location.hash.replace(/^#\/?/,''); if(p&&p!==curPath){ curPath=p; route(); } });
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ e.preventDefault(); navTo(g.dataset.go); return; }
  const a=e.target.closest('a[href^="#/"]'); if(a){ e.preventDefault(); navTo(a.getAttribute('href').slice(2)); }
});
function renderHome(){ renderNow(); renderEss(); renderNear(); renderFavs(); renderPrat(); renderQuick(); renderPseg(); showPane(); renderActLinks(); renderServ(); }
document.querySelectorAll('img[data-ico]').forEach(i=>{ i.src=ICO3[i.dataset.ico]||''; });

applyStatic(); renderCal(); renderDay(); renderUni(); renderFilters(); renderAccs(); renderHome(); curPath=location.hash.replace(/^#\/?/,'')||'accueil'; route();
</script>
